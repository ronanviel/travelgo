<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TravelBloom</title>
  <link rel="stylesheet" href="./travel_recommendation.css">
</head>
<body>
    <nav>
        <img src="travel_bloom_logo.png" width="240" alt="Travel Bloom Logo"/>
        <ul>
          <li><a href="./index.html" id="home">Home </a></li
          <li><a href="./about_us.html" id="aboutUs">About us</a></li>
          <li><a href="./contact_us.html" id="contactUs">Contact us </a></li>
        </ul>
    </nav>

  <main class="contact-content">
  <section class="contact-introduction">
    <h1>CONTACT US</h1>
    <p>Get in touch</p>
  </section>

  <section class="contact-form-container">
    <form class="contact-form" action="#" method="post">

      <div class="form-group">
        <label for="name">Name</label>
        <input
          type="text"
          id="name"
          name="name"
          placeholder="Enter your name"
          required
        >
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="Enter your email"
          required
        >
      </div>

      <div class="form-group">
        <label for="message">Message</label>
        <textarea
          id="message"
          name="message"
          placeholder="Enter your message"
          required
        ></textarea>
      </div>

      <button type="submit">Submit</button>

    </form>
  </section>
</main>
</body>
